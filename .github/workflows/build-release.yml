name: Build e release appunti

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**/.latexmkrc'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compila i PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            lezioni/appunti_FRO.tex
            esercitazioni/esercitazioni_FRO.tex
          work_in_root_file_dir: true

      - name: Calcola versione e note di rilascio
        id: meta
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Appunti ed esercitazioni di Fondamenti di Ricerca Operativa, build del $(date -u '+%d/%m/%Y %H:%M') UTC."
            echo
            echo "- \`appunti_FRO.pdf\`: teoria delle lezioni"
            echo "- \`esercitazioni_FRO.pdf\`: esercitazioni con soluzioni"
            echo
            echo "Commit inclusi:"
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "$PREV"..HEAD
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
          } > notes.md
          mkdir -p dist
          cp lezioni/appunti_FRO.pdf dist/appunti_FRO.pdf
          cp esercitazioni/esercitazioni_FRO.pdf dist/esercitazioni_FRO.pdf

      - name: Carica i PDF come artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: dist/*.pdf

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Appunti FRO ${{ steps.meta.outputs.tag }}
          body_path: notes.md
          make_latest: true
          files: dist/*.pdf
